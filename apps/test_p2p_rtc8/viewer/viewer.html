<!DOCTYPE html>
<!--
  viewer.html - P2P 拉流观看端（浏览器，offer 方，Full-ICE）

  架构定位：
    - 与设备端 test_p2p_pusher（answer 方）配对，经 EMQX 交换信令
    - 浏览器 = offer 方 / DTLS active / RTCPeerConnection 原生 Full-ICE
    - 信令：MQTT over WebSocket（mqtt.js），topic 协议与 P2PSignaling.h 一致

  Topic 约定（{devId} 为设备标识）：
    p2p/{devId}/offer        本端 → 设备   {"sid":"...","sdp":"..."}
    p2p/{devId}/answer       设备 → 本端   {"sid":"...","sdp":"..."}
    p2p/{devId}/cand/viewer  本端 → 设备   {"sid":"...","candidate":"{\"candidate\":\"candidate:...\"}"}
    p2p/{devId}/cand/pusher  设备 → 本端   同上（内层为 metaRTC yang_candidate_toJson 输出）
    p2p/{devId}/bye          双向          {"sid":"..."}
    p2p/{devId}/relay        设备 → 本端   {"sid":"...","url":"..."}  改走 SRS WHEP 拉流
    p2p/{devId}/alive        本端 → 设备   {"sid":"..."}  10s 心跳（观看人数追踪）

  SRS 降级链路（与 mediad LiveStreamService 配对）：
    收到 relay → 关闭 P2P RTCPeerConnection → WHEP 拉流（原生 fetch SDP 交换）；
    两种模式下均每 10s 发 alive 心跳（设备端 30s 无心跳判定离开）。

  候选格式适配（依据 metaRTC 8.0 源码核实）：
    - 发往设备：设备端 yang_iceagent_addRemoteCandidate 仅读内层 JSON 的
      "candidate" 键，按空格分词解析；Chrome 的 mDNS 混淆候选（.local）
      设备端 yang_addr_set 无法解析，必须过滤不发
    - 来自设备：内层 JSON 的 sdpMLineIndex 被 metaRTC 误填为 foundation
      递增值（yang_candidate_toJson），本端丢弃该字段、固定用 sdpMid:"0"
-->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>P2P Viewer (metaRTC 8.0)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Segoe UI", "Microsoft YaHei", sans-serif; background: #1e1e1e; color: #ddd; padding: 16px; }
  h2 { margin-bottom: 12px; font-weight: 600; color: #fff; }
  .row { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; align-items: center; }
  label { min-width: 90px; color: #aaa; }
  input, select { background: #2d2d2d; color: #eee; border: 1px solid #444; border-radius: 4px; padding: 6px 8px; }
  input { flex: 1; min-width: 260px; }
  button { padding: 6px 20px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; }
  #btnStart { background: #0a7d32; color: #fff; }
  #btnStop  { background: #a33; color: #fff; }
  button:disabled { background: #555; color: #999; cursor: not-allowed; }
  #stateBar { margin: 10px 0; padding: 6px 10px; background: #2d2d2d; border-radius: 4px; font-size: 13px; }
  #stateBar span { margin-right: 18px; }
  .st-val { color: #6cf; }
  video { width: 100%; max-width: 960px; background: #000; border-radius: 6px; display: block; }
  #logBox { margin-top: 10px; height: 220px; overflow-y: auto; background: #111; border: 1px solid #333;
            border-radius: 4px; padding: 8px; font: 12px/1.5 Consolas, monospace; white-space: pre-wrap; }
  .log-err { color: #f66; }
  .log-ok  { color: #6f6; }
</style>
</head>
<body>
<h2>P2P Viewer（浏览器 offer 方 / Full-ICE）</h2>

<div class="row">
  <label>MQTT (ws)</label>
  <input id="brokerUrl" value="ws://47.121.24.61:10041/mqtt">
</div>
<div class="row">
  <label>设备 ID</label>
  <input id="devId" value="dev001">
</div>
<div class="row">
  <label>ICE 模式</label>
  <select id="iceMode">
    <option value="auto">auto（全候选 STUN+TURN，ICE 自动选路，推荐）</option>
    <option value="host">host（局域网直连，不配 ICE 服务器）</option>
    <option value="stun">stun（Srflx，NAT 穿透）</option>
    <option value="turn">turn（Relay 中继，强制 relay 验证）</option>
  </select>
  <button id="btnStart" onclick="start()">开始观看</button>
  <button id="btnStop" onclick="stop(true)" disabled>挂断</button>
</div>

<div id="stateBar">
  <span>MQTT: <b id="stMqtt" class="st-val">未连接</b></span>
  <span>模式: <b id="stMode" class="st-val">-</b></span>
  <span>ICE: <b id="stIce" class="st-val">-</b></span>
  <span>连接: <b id="stConn" class="st-val">-</b></span>
  <span>会话: <b id="stSid" class="st-val">-</b></span>
</div>

<video id="video" autoplay playsinline muted controls></video>
<div id="logBox"></div>

<script src="https://cdn.jsdelivr.net/npm/mqtt@5/dist/mqtt.min.js"></script>
<script>
"use strict";

/* 自建 coturn（STUN/TURN 同端口，与设备端 test_p2p_pusher 保持一致） */
const ICE_HOST = "dev.srs.cjkhtech.com";
const ICE_PORT = 3478;
const TURN_USER = "gwturn";
const TURN_PASS = "Fuq5VpMROX14zSjxgl62";

let mqttClient = null;   /* mqtt.js 客户端 */
let pc = null;           /* RTCPeerConnection（P2P 与 WHEP 模式复用同一变量） */
let sid = null;          /* 当前会话 ID（与设备端串话校验对应） */
let topicPrefix = "";    /* p2p/{devId} */
let pendingCands = [];   /* Trickle 时序缓存：设备候选可能先于 answer 到达 */
let aliveTimer = null;   /* 10s 心跳定时器（P2P 与 WHEP 模式都发） */

/* ==================== 日志（ISO 8601 时间戳） ==================== */
function log(msg, cls) {
  const box = document.getElementById("logBox");
  const line = document.createElement("div");
  if (cls) line.className = cls;
  line.textContent = new Date().toISOString().replace("T", " ").slice(0, 23) + "  " + msg;
  box.appendChild(line);
  box.scrollTop = box.scrollHeight;
}
function setState(id, text) { document.getElementById(id).textContent = text; }

/* ==================== ICE 配置（按模式装配） ==================== */
function buildRtcConfig(mode) {
  if (mode === "auto") {
    /* 全候选模型（与设备端 iceCandidateType=Turn 对齐）：STUN+TURN 同时配、
     * policy=all，一次协商携带 Host+Srflx+Relay，ICE 按优先级自动选路 */
    return {
      iceServers: [
        { urls: "stun:" + ICE_HOST + ":" + ICE_PORT },
        { urls: "turn:" + ICE_HOST + ":" + ICE_PORT,
          username: TURN_USER, credential: TURN_PASS }
      ],
      iceTransportPolicy: "all"
    };
  }
  if (mode === "stun") {
    return { iceServers: [{ urls: "stun:" + ICE_HOST + ":" + ICE_PORT }] };
  }
  if (mode === "turn") {
    /* iceTransportPolicy=relay：强制只用中继候选，专用于 TURN 链路验证 */
    return {
      iceServers: [{ urls: "turn:" + ICE_HOST + ":" + ICE_PORT,
                     username: TURN_USER, credential: TURN_PASS }],
      iceTransportPolicy: "relay"
    };
  }
  return { iceServers: [] };   /* host：仅本机候选 */
}

/* ==================== 信令发送（JSON 封装与 P2PSignaling 对齐） ==================== */
function publish(topicSuffix, obj) {
  if (!mqttClient || !mqttClient.connected) {
    log("MQTT 未连接，消息未发送: " + topicSuffix, "log-err");
    return;
  }
  mqttClient.publish(topicPrefix + "/" + topicSuffix, JSON.stringify(obj), { qos: 1 });
}

/* ==================== 会话建立 ==================== */
async function start() {
  const brokerUrl = document.getElementById("brokerUrl").value.trim();
  const devId = document.getElementById("devId").value.trim();
  const iceMode = document.getElementById("iceMode").value;
  if (!brokerUrl || !devId) { log("broker 地址与设备 ID 不能为空", "log-err"); return; }

  document.getElementById("btnStart").disabled = true;
  document.getElementById("btnStop").disabled = false;

  topicPrefix = "p2p/" + devId;
  sid = "s" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  pendingCands = [];
  setState("stSid", sid);
  log("会话开始 sid=" + sid + " iceMode=" + iceMode);

  /* ---- 阶段1: 连接 MQTT（viewer 角色：订阅 answer + 设备候选 + bye） ---- */
  mqttClient = mqtt.connect(brokerUrl, {
    clientId: "p2p_viewer_" + devId + "_" + Math.random().toString(36).slice(2, 8),
    clean: true, keepalive: 30, connectTimeout: 10000
  });

  mqttClient.on("connect", async () => {
    setState("stMqtt", "已连接");
    log("MQTT 已连接 " + brokerUrl, "log-ok");
    mqttClient.subscribe([topicPrefix + "/answer",
                          topicPrefix + "/cand/pusher",
                          topicPrefix + "/relay",
                          topicPrefix + "/bye"], { qos: 1 }, (err) => {
      if (err) { log("订阅失败: " + err.message, "log-err"); return; }
      createOfferAndSend(iceMode);   /* 订阅完成后再发 offer，保证 answer 不丢 */
      startAliveHeartbeat();         /* 会话期间持续心跳（P2P/WHEP 模式都发） */
    });
  });

  mqttClient.on("message", onSignalMessage);
  mqttClient.on("error", (e) => { setState("stMqtt", "错误"); log("MQTT 错误: " + e.message, "log-err"); });
  mqttClient.on("close", () => setState("stMqtt", "已断开"));
}

/* ---- 阶段2: 创建 PeerConnection 并发送 offer ---- */
async function createOfferAndSend(iceMode) {
  pc = new RTCPeerConnection(buildRtcConfig(iceMode));
  setState("stMode", "P2P");

  /* 与设备端 track 配置对齐：audio + video 均 recvonly（m-line 顺序 audio 在前） */
  pc.addTransceiver("audio", { direction: "recvonly" });
  const vt = pc.addTransceiver("video", { direction: "recvonly" });

  /* 编解码偏好收敛为 H264（设备端仅编 H264；保留 rtx 重传） */
  try {
    const caps = RTCRtpReceiver.getCapabilities("video");
    const h264 = caps.codecs.filter(c => /h264/i.test(c.mimeType));
    const rtx  = caps.codecs.filter(c => /rtx/i.test(c.mimeType));
    if (h264.length) vt.setCodecPreferences(h264.concat(rtx));
  } catch (e) { log("setCodecPreferences 不支持，保留默认编解码列表"); }

  /* 收到远端媒体轨道 → 绑定 video 元素 */
  pc.ontrack = (ev) => {
    log("收到远端 track: " + ev.track.kind, "log-ok");
    const video = document.getElementById("video");
    if (ev.streams && ev.streams[0]) video.srcObject = ev.streams[0];
    else {
      if (!video.srcObject) video.srcObject = new MediaStream();
      video.srcObject.addTrack(ev.track);
    }
  };

  /* Trickle：本端候选经信令外发（过滤 mDNS .local，设备端无法解析） */
  pc.onicecandidate = (ev) => {
    if (!ev.candidate || !ev.candidate.candidate) return;
    const candStr = ev.candidate.candidate;
    if (candStr.indexOf(".local") >= 0) {
      log("跳过 mDNS 候选（设备端不支持解析）: " + candStr.slice(0, 60));
      return;
    }
    /* 设备端 addIceCandidate 只读内层 JSON 的 "candidate" 键 */
    publish("cand/viewer", { sid: sid, candidate: JSON.stringify({ candidate: candStr }) });
    log("本端候选已发送: " + candStr.slice(0, 80));
  };

  pc.oniceconnectionstatechange = () => setState("stIce", pc.iceConnectionState);
  pc.onconnectionstatechange = () => {
    setState("stConn", pc.connectionState);
    if (pc.connectionState === "connected") log("P2P 连接建立（ICE/DTLS/SRTP 就绪）", "log-ok");
    if (pc.connectionState === "failed") log("P2P 连接失败（检查 ICE 模式与网络拓扑）", "log-err");
  };

  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);
  publish("offer", { sid: sid, sdp: offer.sdp });
  log("offer 已发送 (" + offer.sdp.length + " bytes)，等待设备 answer...");
}

/* ==================== 信令接收分发 ==================== */
async function onSignalMessage(topic, payload) {
  let msg;
  try { msg = JSON.parse(payload.toString()); }
  catch (e) { log("信令 JSON 解析失败: " + payload.toString().slice(0, 100), "log-err"); return; }
  if (msg.sid !== sid) { log("sid 不匹配，丢弃: " + topic); return; }

  if (topic === topicPrefix + "/answer") {
    log("收到 answer (" + (msg.sdp || "").length + " bytes)");
    try {
      await pc.setRemoteDescription({ type: "answer", sdp: msg.sdp });
      log("setRemoteDescription(answer) 完成", "log-ok");
      /* 补注入先于 answer 到达的设备候选 */
      for (const cand of pendingCands) await injectDeviceCandidate(cand);
      pendingCands = [];
    } catch (e) { log("setRemoteDescription 失败: " + e.message, "log-err"); }

  } else if (topic === topicPrefix + "/cand/pusher") {
    /* Trickle 时序：answer 未 set 前候选入队，否则立即注入 */
    if (!pc || !pc.remoteDescription) {
      pendingCands.push(msg.candidate);
      log("设备候选先于 answer 到达，已缓存 (" + pendingCands.length + ")");
    } else {
      await injectDeviceCandidate(msg.candidate);
    }

  } else if (topic === topicPrefix + "/relay") {
    /* 设备通知改走 SRS：P2P 超时兜底 / 多人观看全员切 WHEP */
    log("收到 relay，切换 WHEP 拉流: " + msg.url, "log-ok");
    await switchToWhep(msg.url);

  } else if (topic === topicPrefix + "/bye") {
    log("收到设备 bye，会话结束");
    stop(false);
  }
}

/* 设备候选注入：内层为 metaRTC yang_candidate_toJson 输出；
 * 丢弃其 sdpMLineIndex（被误填为 foundation），固定 sdpMid:"0"（BUNDLE 单传输） */
async function injectDeviceCandidate(candJson) {
  try {
    const inner = JSON.parse(candJson);
    await pc.addIceCandidate({ candidate: inner.candidate, sdpMid: "0" });
    log("设备候选已注入: " + inner.candidate.slice(0, 80), "log-ok");
  } catch (e) { log("addIceCandidate 失败: " + e.message, "log-err"); }
}

/* ==================== WHEP 拉流（SRS 降级链路） ==================== */
/* 原生 fetch SDP 交换（WHEP 协议：POST offer → 201 + answer），不引额外 SDK；
 * SRS 公网直连无需 ICE 服务器（应答自携候选，ICE-Lite） */
async function switchToWhep(whepUrl) {
  /* 先关 P2P 连接（保留 MQTT：继续收 bye 与发 alive 心跳） */
  if (pc) { pc.close(); pc = null; }
  pendingCands = [];
  setState("stMode", "WHEP");

  try {
    pc = new RTCPeerConnection({ iceServers: [] });
    pc.addTransceiver("audio", { direction: "recvonly" });
    pc.addTransceiver("video", { direction: "recvonly" });

    pc.ontrack = (ev) => {
      const video = document.getElementById("video");
      if (ev.streams && ev.streams[0]) video.srcObject = ev.streams[0];
      else {
        if (!video.srcObject) video.srcObject = new MediaStream();
        video.srcObject.addTrack(ev.track);
      }
    };
    pc.oniceconnectionstatechange = () => setState("stIce", pc.iceConnectionState);
    pc.onconnectionstatechange = () => {
      setState("stConn", pc.connectionState);
      if (pc.connectionState === "connected") log("WHEP 拉流已连接", "log-ok");
      if (pc.connectionState === "failed") log("WHEP 连接失败", "log-err");
    };

    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);

    const resp = await fetch(whepUrl, {
      method: "POST",
      headers: { "Content-Type": "application/sdp" },
      body: offer.sdp
    });
    if (!resp.ok && resp.status !== 201) {
      throw new Error("WHEP HTTP " + resp.status);
    }
    const answerSdp = await resp.text();
    await pc.setRemoteDescription({ type: "answer", sdp: answerSdp });
    log("WHEP SDP 交换完成，等待媒体流...", "log-ok");
  } catch (e) {
    log("WHEP 拉流失败: " + e.message, "log-err");
  }
}

/* ==================== alive 心跳（观看人数追踪） ==================== */
/* P2P 与 WHEP 模式都发：WHEP 观看者没有 DTLS close 兜底，
 * 设备端依靠心跳判定离开（30s 无心跳停推） */
function startAliveHeartbeat() {
  stopAliveHeartbeat();
  aliveTimer = setInterval(() => {
    if (sid) publish("alive", { sid: sid });
  }, 10000);
}
function stopAliveHeartbeat() {
  if (aliveTimer) { clearInterval(aliveTimer); aliveTimer = null; }
}

/* ==================== 会话结束（幂等） ==================== */
function stop(sendBye) {
  stopAliveHeartbeat();
  const client = mqttClient; mqttClient = null;   /* 先摘引用，保证幂等 */
  if (pc) { pc.close(); pc = null; }
  if (client) {
    if (sendBye && sid && client.connected) {
      /* bye 必须等待发送完成回调后再断开：
       * mqtt.js publish 为异步入队，若立即 end(true) 会丢弃在途报文，
       * 导致设备收不到 bye（设备端另有 DTLS close_notify 兜底） */
      client.publish(topicPrefix + "/bye", JSON.stringify({ sid: sid }), { qos: 1 },
                     () => client.end(true));
    } else {
      client.end(true);
    }
  }
  document.getElementById("video").srcObject = null;
  setState("stMqtt", "未连接"); setState("stMode", "-"); setState("stIce", "-"); setState("stConn", "-");
  document.getElementById("btnStart").disabled = false;
  document.getElementById("btnStop").disabled = true;
  log("会话已结束");
  sid = null;
}

/* 页面关闭前尽力通知设备释放会话 */
window.addEventListener("beforeunload", () => { if (sid) stop(true); });
</script>
</body>
</html>
