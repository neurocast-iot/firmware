# EMQX — P2P 信令专用 MQTT broker
#
# 用途：为 test_p2p_pusher（设备端，MQTT over TCP）与浏览器 viewer
#      （mqtt.js，MQTT over WebSocket）提供统一的信令路由。
#      业务平台（ThingsBoard）不受影响，两者相互独立。
#
# 启动：docker compose up -d
# 验证：浏览器打开 http://<宿主机IP>:10042（Dashboard，默认账号 admin/public）
#
# 端口说明（宿主机端口 -> 容器端口）：
#   10040 MQTT over TCP        —— 设备端 paho（-b tcp://<IP>:10040）
#   10041 MQTT over WebSocket  —— 浏览器 mqtt.js（ws://<IP>:10041/mqtt）
#   10042 Web Dashboard        —— 管理界面（可观察客户端连接与 topic 流量）
#
# 认证说明：EMQX 5.x 默认未配置认证器 = 允许匿名接入，适合内网联调；
#          若部署到公网，须在 Dashboard 中启用密码认证并配置 ACL。
services:
  emqx:
    image: emqx/emqx:5.8
    container_name: emqx-p2p
    restart: unless-stopped
    ports:
      - "10040:1883"     # MQTT over TCP（设备端）
      - "10041:8083"     # MQTT over WebSocket（浏览器端，路径 /mqtt）
      - "10042:18083"    # Dashboard
    environment:
      # Dashboard 初始密码（首次登录后建议修改）
      - EMQX_DASHBOARD__DEFAULT_PASSWORD=public
    volumes:
      - emqx-data:/opt/emqx/data
      - emqx-log:/opt/emqx/log
    healthcheck:
      test: ["CMD", "/opt/emqx/bin/emqx", "ctl", "status"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  emqx-data:
  emqx-log:
